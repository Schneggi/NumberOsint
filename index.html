": "Bahrain"}, {"code": "+974", "land": "Katar"}, {"code": "+975", "land": "Bhutan"}, {"code": "+976", "land": "Mongolei"}, {"code": "+977", "land": "Nepal"}, {"code": "+98", "land": "Iran"}, {"code": "+992", "land": "Tadschikistan"}, {"code": "+993", "land": "Turkmenistan"}, {"code": "+994", "land": "Aserbaidschan"}, {"code": "+995", "land": "Georgien"}, {"code": "+996", "land": "Kirgisistan"}, {"code": "+998", "land": "Usbekistan"}];

        // German mobile prefixes: original allocation (Bundesnetzagentur).
        // Longer prefixes (5 digits) override shorter ones.
        const DE_MOBILE = {
            // Telekom
            '0151': 'Telekom', '0160': 'Telekom', '0170': 'Telekom', '0171': 'Telekom', '0175': 'Telekom',
            // Vodafone
            '0152': 'Vodafone', '0162': 'Vodafone', '0172': 'Vodafone', '0173': 'Vodafone', '0174': 'Vodafone',
            '01521': 'Other service provider (not Vodafone)',
            // Telefonica (o2)
            '0159': 'o2 (Telefonica)', '0176': 'o2 (Telefonica)', '0179': 'o2 (Telefonica)',
            // former E-Plus, now Telefonica (o2)
            '0157': 'o2 (Telefonica, former E-Plus)', '0163': 'o2 (Telefonica, former E-Plus)',
            '0177': 'o2 (Telefonica, former E-Plus)', '0178': 'o2 (Telefonica, former E-Plus)',
            // others
            '01555': '1&1 Mobilfunk',
            '0150': 'Service provider (no network operator)', '0153': 'Service provider (no network operator)',
            '0158': 'TelcoVillage (service provider)',
            '0164': 'Paging, not mobile', '0168': 'Paging, not mobile', '0169': 'Paging, not mobile'
        };

        // Find countries by code ("49", "+49", "0049") or by name ("deutsch")
        function findCountries(input) {
            const q = input.trim().toLowerCase();
            if (!q) return [];
            const digits = q.replace(/^(\+|00)/, '');
            if (/^\d+$/.test(digits)) {
                return COUNTRY_CODES.filter(c => c.code === '+' + digits);
            }
            return COUNTRY_CODES.filter(c => c.land.toLowerCase().includes(q));
        }

        // Works with "0176...", "176...", or "+49176..."
        function germanCarrier(number) {
            let n = number.replace(/\D/g, '');
            if (n.startsWith('0049')) n = n.slice(4);
            else if (n.startsWith('49') && n.length > 10) n = n.slice(2);
            n = n.replace(/^0+/, '');
            const national = '0' + n;
            for (const len of [5, 4]) {
                const key = national.slice(0, len);
                if (DE_MOBILE[key]) return {prefix: key, carrier: DE_MOBILE[key]};
            }
            return null;
        }

        function lookupCountry() {
            const value = document.getElementById('CountryCode').value;
            const info = document.getElementById('countryInfo');
            if (!value.trim()) { info.textContent = ''; return; }
            const matches = findCountries(value);
            info.textContent = matches.length
                ? matches.map(c => c.code + ' = ' + c.land).join(' | ')
                : 'No country found.';
        }

        function searchNumbers() {
            const input = document.getElementById('CountryCode').value;
            const phoneOne = document.getElementById('PhoneOne').value.trim();
            const phoneTwo = document.getElementById('PhoneTwo').value.trim();

            if (!input || !phoneOne || !phoneTwo) {
                alert('Please fill in all fields.');
                return;
            }

            const matches = findCountries(input);
            if (!matches.length) {
                alert('Country code not found.');
                return;
            }

            const code = matches[0].code;
            const countries = [...new Set(matches.map(c => c.land))].join(', ');
            const isGermany = code === '+49';
            const clean = n => n.replace(/\D/g, '').replace(/^0+/, '');

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `<p>Searching for numbers: ${code}${clean(phoneOne)} and ${code}${clean(phoneTwo)}</p>`;

            const metadataDiv = document.getElementById('metadata');
            metadataDiv.innerHTML = [phoneOne, phoneTwo].map(n => {
                let line = `<p>${code}${clean(n)} - Country code: ${code} - Country: ${countries}`;
                if (isGermany) {
                    const r = germanCarrier(n);
                    line += r
                        ? ` - Prefix: ${r.prefix} - Original carrier: ${r.carrier}`
                        : ` - Carrier: unknown (landline or unassigned prefix)`;
                } else {
                    line += ` - Carrier lookup is only available for Germany (+49)`;
                }
                return line + '</p>';
            }).join('') +
            (isGermany ? '<p><small>Note: The prefix only shows the originally allocated carrier. Because of number portability and providers like congstar or Aldi Talk, the current carrier can differ.</small></p>' : '');
        }
    </script>
