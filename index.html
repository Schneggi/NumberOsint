<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gray Osint</title>
  <style>
:root{--bg:#080304;--panel:#12070a;--fg:#ffd6d6;--dim:#8a4f55;--acc:#ff2a3d;--acc2:#ff7a45;--warn:#ffc857;--line:#3a0f16;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080304;--fg:#ffd6d6}}
:root[data-theme="dark"]{--bg:#080304;--fg:#ffd6d6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;overflow-x:hidden;animation:flick 6s infinite}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35}
body::before{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
body::after{content:"";position:fixed;left:0;right:0;height:120px;top:-120px;z-index:3;pointer-events:none;background:linear-gradient(transparent,rgba(255,42,61,.1),transparent);animation:sweep 5s linear infinite}
@keyframes sweep{to{transform:translateY(calc(100vh + 240px))}}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.88}98%{opacity:1}99%{opacity:.92}}
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;border-bottom:1px dashed var(--line);padding-bottom:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px;box-shadow:0 0 10px var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.2;transform:scale(.6)}}
h1{position:relative;margin:26px 0 4px;font-size:clamp(34px,9vw,76px);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);text-shadow:0 0 12px rgba(255,42,61,.8),0 0 40px rgba(255,42,61,.4);line-height:1}
h1::before,h1::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
h1::before{color:var(--acc2);text-shadow:none;animation:g1 3.2s infinite steps(1);mix-blend-mode:screen}
h1::after{color:var(--warn);text-shadow:none;animation:g2 2.7s infinite steps(1);mix-blend-mode:screen}
@keyframes g1{0%,90%,100%{clip-path:inset(0 0 100% 0);transform:none}91%{clip-path:inset(10% 0 60% 0);transform:translate(-5px,0)}94%{clip-path:inset(60% 0 10% 0);transform:translate(6px,0)}97%{clip-path:inset(30% 0 40% 0);transform:translate(-3px,0)}}
@keyframes g2{0%,86%,100%{clip-path:inset(0 0 100% 0);transform:none}87%{clip-path:inset(50% 0 20% 0);transform:translate(5px,0)}92%{clip-path:inset(5% 0 80% 0);transform:translate(-6px,0)}95%{clip-path:inset(70% 0 5% 0);transform:translate(3px,0)}}
.sub{color:var(--dim);font-size:13px;min-height:1.4em}
.sub::after{content:"▌";animation:blink .8s infinite;color:var(--acc)}
@keyframes blink{50%{opacity:0}}
.panel{position:relative;margin-top:22px;padding:20px;background:linear-gradient(160deg,rgba(18,7,10,.92),rgba(8,3,4,.92));border:1px solid var(--line);animation:rise .8s both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(6px)}}
.panel i{position:absolute;width:16px;height:16px;border:2px solid var(--acc);filter:drop-shadow(0 0 5px var(--acc))}
.panel i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0}
.panel i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0}
.panel i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0}
.panel i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0}
.form{display:grid;grid-template-columns:1fr 1.4fr 1.4fr auto;gap:12px}
label{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:5px;text-transform:uppercase}
input{width:100%;background:rgba(255,42,61,.05);border:1px solid var(--line);border-bottom:2px solid var(--acc);color:var(--acc);font:inherit;font-size:16px;padding:12px;outline:0;transition:.25s;border-radius:0}
input::placeholder{color:#5c2d35}
input:focus{background:rgba(255,42,61,.12);box-shadow:0 0 18px rgba(255,42,61,.45);transform:translateY(-2px)}
button{align-self:end;position:relative;overflow:hidden;cursor:pointer;background:transparent;color:var(--acc);border:1px solid var(--acc);font:inherit;font-weight:bold;letter-spacing:.2em;text-transform:uppercase;padding:13px 26px;transition:.25s;min-height:46px}
button::before{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,42,61,.55),transparent);transition:.5s}
button:hover{background:var(--acc);color:#1a0004;box-shadow:0 0 28px var(--acc)}
button:hover::before{left:140%}
button:active{transform:scale(.95)}
#countryInfo{margin:14px 0 0;font-size:13px;color:var(--acc2);min-height:1.2em;word-break:break-word}
.bar{height:3px;background:var(--line);margin-top:16px;overflow:hidden;opacity:0;transition:opacity .3s}
.bar.on{opacity:1}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 12px var(--acc)}
.bar.on b{animation:load 1.1s ease-out forwards}
@keyframes load{to{width:100%}}
#results{margin-top:14px;font-size:14px;color:var(--fg)}
h4{margin:28px 0 12px;font-size:12px;letter-spacing:.35em;color:var(--acc2);text-transform:uppercase;display:flex;align-items:center;gap:12px}
h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--acc2),transparent)}
#metadata{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{position:relative;padding:16px;background:rgba(18,7,10,.9);border:1px solid var(--line);border-left:3px solid var(--acc);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;overflow:hidden}
.card::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--acc);box-shadow:0 0 12px var(--acc);top:0;animation:scan 1.4s ease-in-out 1}
@keyframes scan{from{top:0;opacity:1}to{top:100%;opacity:0}}
@keyframes pop{from{opacity:0;transform:translateX(-40px) rotateY(40deg)}}
.card h5{margin:0 0 10px;font-size:20px;color:var(--acc);text-shadow:0 0 10px rgba(255,42,61,.7);word-break:break-all}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.row span:first-child{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.15em;padding-top:2px;white-space:nowrap}
.row span:last-child{text-align:right;color:var(--fg);word-break:break-word}
.note{grid-column:1/-1;color:var(--dim);font-size:12px;border:1px dashed var(--line);padding:10px}
.warn{color:var(--warn)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (max-width:760px){
.form{grid-template-columns:1fr}
button{width:100%}
.panel{padding:16px}
.top span:last-child{display:none}
#metadata{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}#rain{display:none}}
</style>
</head>
<body>
  <canvas id="rain"></canvas>
  <div class="wrap">
    <div class="top">
      <span>Gray Osint</span>
      <span>v1.0</span>
      <h1 data-t="Gray Osint">Gray Osint</h1>
      <div class="sub">By Gray | Furry</div>
      <div class="sub" id="boot"></div>
    </div>
    <br>
    <div>
    <button id="searchButton" onclick="window.location.href='numberosint.html'">Number Osint</button>
    <button id="searchButton" onclick="window.location.href='usernameosint.html'">Username Osint</button>
    </div>

<script>
const GLYPHS='01ABCDEF<>/\\|#$%&*+=?';
function decrypt(el,text,dur){
  dur=dur||700;
  const t0=performance.now();
  (function step(now){
    const p=Math.min(1,(now-t0)/dur),k=Math.floor(p*text.length);
    let s=text.slice(0,k);
    for(let i=k;i<text.length;i++) s+=text[i]===' '?' ':GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
    el.textContent=s;
    if(p<1) requestAnimationFrame(step); else el.textContent=text;
  })(t0);
}
function typeText(el,text,speed,done){
  let i=0;
  (function t(){ el.textContent=text.slice(0,++i); if(i<text.length) setTimeout(t,speed); else if(done) done(); })();
}
typeText(document.getElementById('boot'),'> Osint initalised',32);
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('de-DE')},1000);

const cv=document.getElementById('rain'),cx=cv.getContext('2d');
let cols,drops;
function resize(){
  cv.width=innerWidth;cv.height=innerHeight;
  cols=Math.ceil(cv.width/16);drops=Array.from({length:cols},()=>Math.random()*-50);
}
resize();addEventListener('resize',resize);
(function rain(){
  cx.fillStyle='rgba(8,3,4,.12)';cx.fillRect(0,0,cv.width,cv.height);
  cx.font='15px monospace';
  for(let i=0;i<cols;i++){
    const ch=Math.random()>.5?'1':'0';
    cx.fillStyle=Math.random()>.97?'#fff0f0':'#ff2a3d';
    cx.fillText(ch,i*16,drops[i]*16);
    if(drops[i]*16>cv.height&&Math.random()>.975) drops[i]=0;
    drops[i]+=.6;
  }
  requestAnimationFrame(rain);
})();
</script>

</body>
</html>
